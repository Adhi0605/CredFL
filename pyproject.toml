[project]
name = "credfl"
version = "0.1.0"
description = "Adaptive differential privacy for federated credit-card fraud detection"
requires-python = ">=3.11,<3.13"
dependencies = [
  "flwr>=1.20,<2",
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.4,<5",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "opacus>=1.5,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "seaborn>=0.13,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
